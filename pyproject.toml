[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dvslam"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["dvslam*", "model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
